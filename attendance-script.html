<script>
let students = [];
let selectedStudent = null;
let searchTimer = null;
let searchRequestId = 0;
let searchResults = [];
let studentIndexLoaded = false;
let indexRefreshRequestId = 0;
let studentIndexPromise = null;
let submissionQueue = [];
let processingSubmissions = false;
let submissionsPaused = false;

const els = {
  nameInput: document.getElementById('nameInput'),
  nameSuggestions: document.getElementById('nameSuggestions'),
  fatherName: document.getElementById('fatherNameInput'),
  motherName: document.getElementById('motherNameInput'),
  dob: document.getElementById('dobInput'),
  classInput: document.getElementById('classInput'),
  phone: document.getElementById('phoneInput'),
  gender: document.getElementById('genderInput'),
  placeSelect: document.getElementById('placeSelect'),
  place: document.getElementById('placeInput'),
  modeOfTransport: document.getElementById('modeOfTransport'),
  modeTransportLabel: document.getElementById('modeTransportLabel'),
  submit: document.getElementById('submitBtn'),
  stats: document.getElementById('stats'),
  statsSummary: document.getElementById('statsSummary'),
  statsTableBody: document.querySelector('#statsTable tbody'),
  refresh: document.getElementById('refreshBtn'),
  statsBtn: document.getElementById('statsBtn'),
  clearBtn: document.getElementById('clearBtn'),
  saveQueueStatus: document.getElementById('saveQueueStatus'),
  retrySaves: document.getElementById('retrySavesBtn'),
};

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function getStudentType() {
  return document.querySelector('input[name=studentType]:checked').value;
}

function restoreStudentIndex() {
  try {
    const cached = JSON.parse(localStorage.getItem('riverKidsStudents_v1_' + APP_GROUP) || 'null');
    if (!cached || !Array.isArray(cached.students)) return false;
    students = cached.students;
    studentIndexLoaded = true;
    return Date.now() - cached.savedAt < 60000;
  } catch (error) {
    return false;
  }
}

function saveStudentIndex() {
  if (!studentIndexLoaded) return;
  try {
    localStorage.setItem('riverKidsStudents_v1_' + APP_GROUP, JSON.stringify({
      savedAt: Date.now(),
      students
    }));
  } catch (error) {
    // Keep the in-memory roster if browser storage is unavailable.
  }
}

async function refreshStudentIndex(showStatus = false) {
  const requestId = ++indexRefreshRequestId;
  if (showStatus) setStatus('Refreshing student list...');
  const refreshPromise = (async () => {
    try {
      const response = await fetch(WEB_APP_BASE + '?path=students&group=' + APP_GROUP);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const payload = await response.json();
      if (requestId !== indexRefreshRequestId) return false;
      students = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.list) ? payload.list : []);
      studentIndexLoaded = true;
      saveStudentIndex();

      const query = els.nameInput.value.trim().toLowerCase();
      if (query.length >= 2 && getStudentType() === 'old' && !selectedStudent) {
        searchRequestId++;
        renderLocalStudentMatches(query);
      } else if (showStatus) {
        setStatus('Student list refreshed.');
      }
      return true;
    } catch (error) {
      if (showStatus) setStatus('Failed to refresh students: ' + error.message, true);
      return false;
    }
  })();

  studentIndexPromise = refreshPromise;
  const refreshed = await refreshPromise;
  if (studentIndexPromise === refreshPromise) studentIndexPromise = null;
  return refreshed;
}

function renderLocalStudentMatches(query) {
  const normalizedQuery = query.toLowerCase();
  const matches = students.filter(student => String(student.name || '').toLowerCase().includes(normalizedQuery)).slice(0, 25);
  renderSuggestions(matches);
  setStatus(matches.length ? matches.length + ' matching students.' : 'No matching students.');
}

async function fetchStudents(query, requestId) {
  const normalizedQuery = String(query || '').trim();
  if (normalizedQuery.length < 2) {
    setStatus('Enter at least two letters to search.');
    return;
  }

  setStatus('Searching students...');
  try {
    const res = await fetch(WEB_APP_BASE + '?path=students&group=' + APP_GROUP + '&q=' + encodeURIComponent(normalizedQuery));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    if (requestId !== searchRequestId) return;
    const matches = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.list) ? payload.list : []);
    renderSuggestions(matches);
    setStatus(matches.length ? matches.length + ' matching students.' : 'No matching students.');
    if (!studentIndexLoaded && !studentIndexPromise) refreshStudentIndex();
    enableSubmitIfReady();
  } catch (e) {
    if (requestId !== searchRequestId) return;
    setStatus('Failed to load students: ' + e.message, true);
  }
}

function enableSubmitIfReady() {
  if (getStudentType() === 'old') {
    els.submit.disabled = !selectedStudent || (els.modeOfTransport && !els.modeOfTransport.value);
  } else {
    const valid = els.nameInput.value.trim() && els.classInput.value.trim() && els.gender.value.trim();
    const requiresTransport = els.modeOfTransport && !els.modeOfTransport.value;
    els.submit.disabled = !valid || requiresTransport;
  }
}

function clearStudentFields() {
  els.fatherName.value = '';
  els.motherName.value = '';
  els.dob.value = '';
  els.classInput.value = '';
  els.phone.value = '';
  els.gender.value = '';
  els.placeSelect.value = '';
  els.place.value = '';
  els.place.classList.add('hidden');
  if (els.modeOfTransport) els.modeOfTransport.value = '';
}

function clearForm() {
  clearTimeout(searchTimer);
  searchRequestId++;
  els.nameInput.value = '';
  clearStudentFields();
  hideSuggestions();
  selectedStudent = null;
  els.submit.disabled = true;
  setStatus('');
  const presentRadio = document.querySelector('input[name=attendance][value="Present"]');
  if (presentRadio) presentRadio.checked = true;
}

function normalizeDateForInput(value) {
  if (!value) return '';
  if (value instanceof Date && !isNaN(value)) return value.toISOString().slice(0, 10);

  const raw = String(value).trim();
  if (!raw) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;

  const parts = raw.split(/[\/\-.]/).map(part => part.trim());
  if (parts.length === 3 && parts[2].length === 4) {
    return parts[2] + '-' + parts[1].padStart(2, '0') + '-' + parts[0].padStart(2, '0');
  }

  const parsed = new Date(raw);
  return isNaN(parsed) ? '' : parsed.toISOString().slice(0, 10);
}

function fillStudentFields(student) {
  els.fatherName.value = student.fatherName || '';
  els.motherName.value = student.motherName || '';
  els.dob.value = normalizeDateForInput(student.dateOfBirth || student.dob || '');
  els.classInput.value = student.class || '';
  els.phone.value = student.phone || '';

  const gender = (student.gender || '').toLowerCase();
  if (gender === 'male' || gender === 'm') els.gender.value = 'Male';
  else if (gender === 'female' || gender === 'f') els.gender.value = 'Female';
  else els.gender.value = student.gender || '';

  const place = (student.place || '').trim();
  const normalizedPlace = place.toLowerCase().replace(/\s+/g, ' ');
  if (normalizedPlace.includes('mg') || normalizedPlace.includes('m g')) {
    els.placeSelect.value = 'MG Palaya';
    els.place.classList.add('hidden');
  } else if (normalizedPlace.includes('ss') || normalizedPlace.includes('s s')) {
    els.placeSelect.value = 'SS Palaya';
    els.place.classList.add('hidden');
  } else if (place) {
    els.placeSelect.value = 'Other';
    els.place.value = place;
    els.place.classList.remove('hidden');
  } else {
    els.placeSelect.value = '';
    els.place.classList.add('hidden');
  }

  if (els.modeOfTransport) els.modeOfTransport.value = student.modeOfTransport || '';
}

els.nameInput.addEventListener('input', () => {
  const value = els.nameInput.value.trim();
  selectedStudent = null;
  clearTimeout(searchTimer);
  const requestId = ++searchRequestId;
  if (value.length < 2 || getStudentType() !== 'old') {
    students = [];
    hideSuggestions();
    enableSubmitIfReady();
    return;
  }
  els.nameSuggestions.textContent = 'Searching...';
  els.nameSuggestions.classList.remove('hidden');
  searchTimer = setTimeout(() => {
    if (studentIndexLoaded) renderLocalStudentMatches(value);
    else fetchStudents(value, requestId);
  }, 250);
});

function renderSuggestions(list) {
  searchResults = list;
  if (!list.length) {
    hideSuggestions();
    return;
  }
  els.nameSuggestions.innerHTML = list.map(student =>
    `<div data-id="${student.id}" data-row="${student.rowIndex}">${student.name}</div>`
  ).join('');
  els.nameSuggestions.classList.remove('hidden');
}

function hideSuggestions() {
  searchResults = [];
  els.nameSuggestions.classList.add('hidden');
  els.nameSuggestions.innerHTML = '';
}

els.nameSuggestions.addEventListener('click', event => {
  const option = event.target.closest('div[data-id]');
  if (!option) return;
  selectedStudent = searchResults.find(student => String(student.id) === option.dataset.id);
  if (!selectedStudent) return;
  els.nameInput.value = selectedStudent.name;
  fillStudentFields(selectedStudent);
  hideSuggestions();
  enableSubmitIfReady();
});

Array.from(document.querySelectorAll('input[name=studentType]')).forEach(radio => {
  radio.addEventListener('change', () => {
    selectedStudent = null;
    clearStudentFields();
    els.submit.disabled = true;
    enableSubmitIfReady();
  });
});

['classInput', 'phoneInput', 'genderInput', 'placeInput', 'placeSelect', 'modeOfTransport'].forEach(id => {
  const element = document.getElementById(id);
  if (element) {
    element.addEventListener('input', enableSubmitIfReady);
    element.addEventListener('change', enableSubmitIfReady);
  }
});

els.placeSelect.addEventListener('change', () => {
  if (els.placeSelect.value === 'Other') {
    els.place.classList.remove('hidden');
    els.place.focus();
  } else {
    els.place.classList.add('hidden');
    els.place.value = '';
  }
  enableSubmitIfReady();
});

els.refresh.addEventListener('click', () => refreshStudentIndex(true));
els.statsBtn.addEventListener('click', loadStats);
els.clearBtn.addEventListener('click', () => {
  clearForm();
  enableSubmitIfReady();
});
els.submit.addEventListener('click', submitAttendance);
els.retrySaves.addEventListener('click', () => {
  submissionsPaused = false;
  els.retrySaves.classList.add('hidden');
  processSubmissionQueue();
});

function setQueueStatus(message, isError = false) {
  els.saveQueueStatus.textContent = message;
  els.saveQueueStatus.style.color = isError ? '#b42318' : '#365c78';
}

async function submitAttendance() {
  const type = getStudentType();
  const attendanceStatus = document.querySelector('input[name=attendance]:checked').value;
  const date = todayISO();
  if (els.submit.disabled) return;

  const student = type === 'old' ? selectedStudent : null;
  let endpoint;
  let payload;
  if (type === 'old') {
    if (!student) {
      setStatus('Select a student first.', true);
      return;
    }
    endpoint = '?path=attendance';
    const placeValue = els.placeSelect.value === 'Other' ? els.place.value.trim() : els.placeSelect.value;
    payload = {
      rowIndex: student.rowIndex,
      date,
      status: attendanceStatus,
      group: APP_GROUP,
      fatherName: els.fatherName.value.trim(),
      motherName: els.motherName.value.trim(),
      dateOfBirth: els.dob.value,
      studentClass: els.classInput.value.trim(),
      phone: els.phone.value.trim(),
      gender: els.gender.value.trim(),
      place: placeValue,
      modeOfTransport: els.modeOfTransport ? els.modeOfTransport.value : ''
    };
  } else {
    endpoint = '?path=newStudent';
    payload = {
      name: els.nameInput.value.trim(),
      fatherName: els.fatherName.value.trim(),
      motherName: els.motherName.value.trim(),
      dateOfBirth: els.dob.value,
      studentClass: els.classInput.value.trim(),
      phone: els.phone.value.trim(),
      gender: els.gender.value.trim(),
      place: els.placeSelect.value === 'Other' ? els.place.value.trim() : els.placeSelect.value,
      date,
      status: attendanceStatus,
      group: APP_GROUP,
      modeOfTransport: els.modeOfTransport ? els.modeOfTransport.value : ''
    };
  }

  submissionQueue.push({
    endpoint,
    type,
    payload,
    student,
    name: payload.name || student.name
  });
  clearForm();
  enableSubmitIfReady();
  setQueueStatus('Attendance queued. Ready for the next entry (' + submissionQueue.length + ' pending).' +
    (submissionsPaused ? ' Retry the previous save to continue.' : ''));
  processSubmissionQueue();
}

async function processSubmissionQueue() {
  if (processingSubmissions || submissionsPaused || !submissionQueue.length) return;
  processingSubmissions = true;
  els.retrySaves.disabled = true;

  while (submissionQueue.length) {
    const item = submissionQueue[0];
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    try {
      const response = await fetch(WEB_APP_BASE + item.endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify(item.payload),
        signal: controller.signal
      });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const result = await response.json();
      if (result.error) throw new Error(result.error);

      if (item.type === 'old') {
        Object.assign(item.student, {
          fatherName: item.payload.fatherName,
          motherName: item.payload.motherName,
          dateOfBirth: item.payload.dateOfBirth,
          class: item.payload.studentClass,
          phone: item.payload.phone,
          gender: item.payload.gender,
          place: item.payload.place,
          modeOfTransport: item.payload.modeOfTransport
        });
        saveStudentIndex();
      } else {
        students.push({
          id: result.rowIndex,
          rowIndex: result.rowIndex,
          name: item.payload.name,
          fatherName: item.payload.fatherName,
          motherName: item.payload.motherName,
          dateOfBirth: item.payload.dateOfBirth,
          class: item.payload.studentClass,
          phone: item.payload.phone,
          gender: item.payload.gender,
          place: item.payload.place,
          modeOfTransport: item.payload.modeOfTransport
        });
        saveStudentIndex();
      }

      submissionQueue.shift();
      setQueueStatus(submissionQueue.length
        ? item.name + ' saved. ' + submissionQueue.length + ' more pending.'
        : item.name + ' saved. Ready for the next entry.');
    } catch (error) {
      const message = error.name === 'AbortError' ? 'Request timed out.' : error.message;
      setQueueStatus(item.name + ' was not confirmed saved. It is still queued. ' + message, true);
      submissionsPaused = true;
      els.retrySaves.classList.remove('hidden');
      break;
    } finally {
      clearTimeout(timeoutId);
    }
  }

  processingSubmissions = false;
  els.retrySaves.disabled = false;
  if (!submissionQueue.length) {
    submissionsPaused = false;
    els.retrySaves.classList.add('hidden');
  }
}

async function loadStats() {
  const date = todayISO();
  setStatus('Loading stats for ' + date + ' (' + APP_GROUP + ')...');
  try {
    const response = await fetch(WEB_APP_BASE + '?path=stats&date=' + date + '&group=' + APP_GROUP);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    renderStats(await response.json());
    setStatus('Stats loaded.');
  } catch (error) {
    setStatus('Failed to load stats: ' + error.message, true);
  }
}

function renderStats(stats) {
  els.stats.classList.remove('hidden');
  const groups = stats.counts.group;
  els.statsSummary.innerHTML = `
    <div class="flex-line">
      <span class="pill">Date: ${stats.date}</span>
      <span class="pill">Present: ${stats.counts.present}</span>
      <span class="pill">Absent: ${stats.counts.absent}</span>
      <span class="pill">Junior (KG-3) P:${groups.junior.present} A:${groups.junior.absent}</span>
      <span class="pill">Inter (4-6) P:${groups.inter.present} A:${groups.inter.absent}</span>
      <span class="pill">Senior (7-12) P:${groups.senior.present} A:${groups.senior.absent}</span>
    </div>`;
  els.statsTableBody.innerHTML = stats.list.map(student =>
    `<tr><td>${student.name}</td><td>${student.class}</td><td>${student.group}</td><td>${student.status}</td></tr>`
  ).join('');
}

if (els.modeOfTransport) {
  els.modeOfTransport.classList.remove('hidden');
  els.modeTransportLabel.classList.remove('hidden');
}
const hasFreshStudentIndex = restoreStudentIndex();
if (studentIndexLoaded && !hasFreshStudentIndex) setTimeout(() => refreshStudentIndex(), 100);
</script>
