<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>River Kids Attendance</title>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand"><span class="sidebar-brand-full">RIVER KIDS</span><span class="sidebar-brand-short">RK</span></div>
        <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
          <span id="sidebarToggleIcon" aria-hidden="true">&lt;&lt;</span>
          <span class="sidebar-toggle-label">Collapse</span>
        </button>
      </div>
      <nav class="sidebar-nav" aria-label="Main menu">
        <a id="churchAttendanceLink" href="#" title="Church Attendance"><span class="nav-label">Church Attendance</span><span class="nav-short" aria-hidden="true">CA</span></a>
        <a id="churchReportLink" href="#" title="Church Reports"><span class="nav-label">Church Reports</span><span class="nav-short" aria-hidden="true">CR</span></a>
        <a id="rffAttendanceLink" href="#" title="RFF Attendance"><span class="nav-label">RFF Attendance</span><span class="nav-short" aria-hidden="true">RA</span></a>
        <a id="rffReportLink" href="#" title="RFF Reports"><span class="nav-label">RFF Reports</span><span class="nav-short" aria-hidden="true">RR</span></a>
      </nav>
    </aside>
    <header class="header">
      <div class="header-logo"><img src="kids_logo-removebg-preview.png" alt="Kids Logo" /></div>
      <h1 id="pageTitle">River Kids Attendance</h1>
      <p id="pageSubtitle" class="header-subtitle"></p>
    </header>
    <main class="content">
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="pageModule"></div>
    </main>
  </div>

  <script>
    const WEB_APP_BASE = 'https://script.google.com/macros/s/AKfycbxqDvtRZCcVFLKveCwDDYdj3HZikI-dsMlknZyJ2OR9HlkO1Qjd8lSdO9tqEyUsiUnk/exec';
    const params = new URLSearchParams(window.location.search);
    const APP_GROUP = params.get('group') === 'RFF' ? 'RFF' : 'Church';
    const APP_PAGE = params.get('page') === 'report' ? 'report' : 'attendance';
    const statusElement = document.getElementById('status');

    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.style.color = isError ? '#c00' : '#0a4a0a';
    }

    const pageTitle = APP_GROUP + (APP_PAGE === 'report' ? ' Reports' : ' Attendance');
    document.getElementById('pageTitle').textContent = pageTitle;
    document.getElementById('pageSubtitle').textContent = APP_PAGE === 'report'
      ? 'Review attendance by date'
      : 'Record and manage student attendance';
    document.title = 'River Kids ' + pageTitle;

    [
      ['churchAttendanceLink', 'Church', 'attendance'],
      ['churchReportLink', 'Church', 'report'],
      ['rffAttendanceLink', 'RFF', 'attendance'],
      ['rffReportLink', 'RFF', 'report']
    ].forEach(([id, groupName, pageName]) => {
      const link = document.getElementById(id);
      link.href = window.location.pathname + '?group=' + groupName + '&page=' + pageName;
      if (groupName === APP_GROUP && pageName === APP_PAGE) link.setAttribute('aria-current', 'page');
    });

    const appContainer = document.querySelector('.container');
    const sidebarToggle = document.getElementById('sidebarToggle');
    sidebarToggle.addEventListener('click', () => {
      const collapsed = appContainer.classList.toggle('sidebar-collapsed');
      sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
      sidebarToggle.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
      sidebarToggle.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
      document.getElementById('sidebarToggleIcon').textContent = collapsed ? '>>' : '<<';
      sidebarToggle.querySelector('.sidebar-toggle-label').textContent = collapsed ? 'Expand' : 'Collapse';
    });

    async function loadSelectedPage() {
      const viewName = APP_GROUP.toLowerCase() + '-' + (APP_PAGE === 'report' ? 'reports' : 'attendance');
      const scriptName = APP_PAGE === 'report' ? 'reports-script' : 'attendance-script';
      const [styleResponse, viewResponse, scriptResponse] = await Promise.all([
        fetch('./styles.html'),
        fetch('./' + viewName + '.html'),
        fetch('./' + scriptName + '.html')
      ]);
      if (!styleResponse.ok || !viewResponse.ok || !scriptResponse.ok) {
        throw new Error('A page module failed to load.');
      }

      const [styleMarkup, viewMarkup, scriptMarkup] = await Promise.all([
        styleResponse.text(), viewResponse.text(), scriptResponse.text()
      ]);
      const parsedScript = new DOMParser().parseFromString(scriptMarkup, 'text/html').querySelector('script');
      if (!parsedScript) throw new Error('The selected page script is missing.');

      document.head.insertAdjacentHTML('beforeend', styleMarkup);
      document.getElementById('pageModule').innerHTML = viewMarkup;
      const pageScript = document.createElement('script');
      pageScript.textContent = parsedScript.textContent;
      document.body.appendChild(pageScript);
    }

    loadSelectedPage().catch(error => setStatus('Failed to load page: ' + error.message, true));
  </script>
</body>
</html>
