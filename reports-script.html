<script>
const dateSelect = document.getElementById('dateSelect');
const downloadButton = document.getElementById('downloadBtn');
document.getElementById('reportGroupLegend').textContent = APP_GROUP + ' Report';

async function loadAvailableDates() {
  try {
    const response = await fetch(WEB_APP_BASE + '?path=dates&group=' + APP_GROUP);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();
    if (result.dates && result.dates.length) {
      dateSelect.innerHTML = '<option value="">Select a date...</option>' +
        result.dates.map(date => `<option value="${date}">${date}</option>`).join('');
    }
  } catch (error) {
    setStatus('Failed to load report dates: ' + error.message, true);
  }
}

dateSelect.addEventListener('change', () => {
  downloadButton.disabled = !dateSelect.value;
});

downloadButton.addEventListener('click', async () => {
  const date = dateSelect.value;
  if (!date) {
    setStatus('Please select a date.', true);
    return;
  }

  setStatus('Generating report...');
  downloadButton.disabled = true;
  try {
    const response = await fetch(WEB_APP_BASE + '?path=report&date=' + date + '&group=' + APP_GROUP);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const report = await response.json();
    openAttendanceReport(report, date);
    setStatus('Report opened in a new tab.');
  } catch (error) {
    setStatus('Failed to generate report: ' + error.message, true);
  } finally {
    downloadButton.disabled = false;
  }
});

function openAttendanceReport(report, date) {
  const displayDate = new Date(date + 'T00:00:00').toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
  const junior = report.junior.filter(student => student.status === 'Present');
  const inter = report.inter.filter(student => student.status === 'Present');
  const senior = report.senior.filter(student => student.status === 'Present');

  function renderRows(list) {
    if (!list.length) return '<div class="empty-message">No present students</div>';
    return list.map(student => {
      const transport = student.modeOfTransport
        ? ' (' + student.modeOfTransport + ')'
        : '';
      return '<div class="name-item">' + student.name + transport + '</div>';
    }).join('');
  }

  const total = junior.length + inter.length + senior.length;
  const density = total >= 80 ? 'compact' : (total >= 60 ? 'comfortable' : 'roomy');
  const html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Attendance Report - ' + displayDate + '</title><style>' +
    'body{font-family:Arial,sans-serif;padding:16px;max-width:1200px;margin:0 auto;background:#f8f9fa}' +
    '.container{background:#fff;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative}' +
    '.logo-header{position:absolute;top:14px;right:14px;width:64px;height:64px}.logo-header img{width:100%;height:100%;object-fit:contain}' +
    '.header-content{margin-right:80px}h1{text-align:center;color:#333;margin:0 0 3px;font-size:22px}' +
    '.date-header{text-align:center;color:#666;margin-bottom:10px;font-size:13px;font-weight:bold}' +
    '.section{margin-top:8px;break-inside:avoid;page-break-inside:avoid}' +
    'h2{color:#334;border-bottom:1px solid #667eea;padding-bottom:3px;margin:0 0 5px;font-size:12px}' +
    '.names-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin-bottom:6px}' +
    '.name-item{padding:2px 4px;border:1px solid #d8d8d8;border-radius:2px;background:#fff;text-align:left;font-size:10px;font-weight:500;line-height:1.25;min-height:18px;word-break:break-word}' +
    '.container.roomy .name-item{font-size:13px;padding:4px 6px;min-height:24px}.container.roomy h2{font-size:13.5px}' +
    '.container.comfortable .name-item{font-size:11.5px;padding:3px 5px;min-height:20px}.container.comfortable h2{font-size:12.5px}' +
    '.container.compact .name-item{font-size:10px;padding:2px 4px;min-height:18px}' +
    '.empty-message{text-align:center;color:#999;font-style:italic;padding:8px;grid-column:1/-1;font-size:10px}' +
    '.total-count{margin-top:8px;padding-top:6px;border-top:1px solid #cfcfcf;text-align:right;font-size:12px;font-weight:bold;color:#333}' +
    '.actions{text-align:center;margin:12px 0}.print-btn{padding:10px 22px;font-size:14px;cursor:pointer;background:#667eea;color:#fff;border:0;border-radius:5px}' +
    '@media print{@page{margin:5mm;size:A4}body{background:#fff;padding:0}.container{box-shadow:none;border-radius:0;padding:6mm 5mm 4mm}' +
    '.logo-header{width:42px;height:42px;top:4mm;right:5mm}.header-content{margin-right:52px}h1{font-size:14px;margin:0 0 1mm}' +
    '.date-header{font-size:10px;margin-bottom:2mm}.section{margin-top:1.2mm}h2{margin:0 0 1mm;padding-bottom:.6mm}' +
    '.names-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:1.2mm;margin-bottom:1.2mm}.name-item{border-radius:1px;line-height:1.15}' +
    '.container.roomy h2{font-size:12px}.container.roomy .name-item{font-size:11.8px;padding:1.5mm 1.6mm;min-height:7mm}' +
    '.container.comfortable h2{font-size:10.6px}.container.comfortable .name-item{font-size:10.4px;padding:1.1mm 1.2mm;min-height:5.8mm}' +
    '.container.compact h2{font-size:9px}.container.compact .name-item{font-size:8.8px;padding:.7mm 1mm;min-height:4.5mm}' +
    '.empty-message{font-size:8px;padding:2mm}.total-count{margin-top:1.5mm;padding-top:1mm;font-size:9px}.actions{display:none}}' +
    '</style></head><body><div class="container ' + density + '">' +
    '<div class="logo-header"><img src="kids_logo-removebg-preview.png" alt="River Kids Logo"></div>' +
    '<div class="header-content"><h1>River Kids Attendance Report</h1>' +
    '<p class="date-header">Date: <strong>' + displayDate + '</strong> | Group: <strong>' + report.group + '</strong></p></div>' +
    '<div class="section"><h2>Junior (KG, 1, 2, 3) - Count: ' + junior.length + '</h2><div class="names-grid">' + renderRows(junior) + '</div></div>' +
    '<div class="section"><h2>Inter (4, 5, 6) - Count: ' + inter.length + '</h2><div class="names-grid">' + renderRows(inter) + '</div></div>' +
    '<div class="section"><h2>Senior (7, 8, 9, 10, 11, 12) - Count: ' + senior.length + '</h2><div class="names-grid">' + renderRows(senior) + '</div></div>' +
    '<div class="total-count">Total Present Count: ' + total + '</div></div>' +
    '<div class="actions"><button class="print-btn" onclick="window.print()">Print Report</button></div></body></html>';

  const reportWindow = window.open('', '_blank');
  if (!reportWindow) throw new Error('Allow pop-ups to open the report.');
  reportWindow.document.write(html);
  reportWindow.document.close();
}

loadAvailableDates();
</script>
